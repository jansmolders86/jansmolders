<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<!-- Only scripts from this site, MapLibre (pinned) and Google Maps may run; no inline scripts, no plugins. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-AJjxMzZrlc4BMSqQJ+u70Xjk3Eqi9hMUKuKNYj/fb80=' 'wasm-unsafe-eval' 'unsafe-eval' blob: https://unpkg.com/maplibre-gl@4.7.1/ https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://unpkg.com/maplibre-gl@4.7.1/ https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data: blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BeamDrive</title>
<link rel="stylesheet" href="style.css?v=0.34.0">
</head>
<body class="not-casting">
<div id="app">
  <nav id="rail" aria-label="Car controls">
    <button class="rail-btn" data-cmd="dash" aria-label="Dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
    <button class="rail-btn" data-cmd="maps" aria-label="Navigation">
      <svg viewBox="0 0 24 24"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
    </button>
    <button class="rail-btn" data-cmd="apps" aria-label="All apps">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></svg>
    </button>
    <button class="rail-btn" data-cmd="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>


    <div id="batt" hidden title="Phone battery">
      <svg viewBox="0 0 24 12" aria-hidden="true"><rect x="0.75" y="0.75" width="19.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="21" y="3.5" width="2.2" height="5" rx="1" fill="currentColor"/><rect id="batt-fill" x="2.5" y="2.5" width="16" height="7" rx="1.2" fill="currentColor"/></svg>
      <div id="batt-pct">--%</div>
      <div id="batt-temp" hidden></div>
    </div>
    <button class="rail-btn" id="engine-btn" aria-label="Engine sound on or off" title="Engine sound" hidden>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <button class="rail-btn" id="zoom-btn" aria-label="Zoom to fill" title="Zoom to fill / fit" hidden>
      <svg class="i-fill" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 0h2v5h-5v-2h3v-3z"/></svg>
      <svg class="i-fit" viewBox="0 0 24 24"><path d="M9 4v5H4V7h3V4h2zm6 0h2v3h3v2h-5V4zM4 15h5v5H7v-3H4v-2zm11 0h5v2h-3v3h-2v-5z"/></svg>
    </button>
    <button class="rail-btn" id="cast-btn" aria-label="Start or stop casting" hidden>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span class="stop-ask">Stop?</span>
    </button>
    <div id="link" title="Connection"><span class="dot"></span></div>
    <div id="ver" hidden></div>
  </nav>

  <main id="stage">
    <canvas id="screen"></canvas>
    <div id="mapview" hidden></div>
    <div id="notice" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="status" hidden role="status"></div>
    <button id="gemini" hidden aria-label="Talk to Gemini" title="Talk to Gemini">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="tts-stop" hidden aria-label="Stop reading aloud">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop reading</span>
    </button>
    <div id="overlay">
      <div class="ov-title" id="ov-title">Connecting to your phone…</div>
      <div class="ov-sub" id="ov-sub">Make sure BeamDrive is open on your phone.</div>
      <div id="appgrid" hidden></div>
      <form id="pair" hidden autocomplete="off">
        <input id="pair-code" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Pairing code">
        <button type="submit">Connect</button>
        <div id="pair-err"></div>
      </form>
      <div id="pair-sas" hidden></div>
      <button id="pair-ok" hidden>My phone shows this code</button>
      <button id="pair-change" class="ghost" hidden>Use a different code</button>
      <button id="reload" class="ghost">Reload page</button>
    </div>
    <pre id="stats" hidden></pre>
  </main>
</div>
<script>window.BEAM_MODE = "rtc"; window.BEAM_PAGE_VERSION = "0.34.0";</script>
<script src="app.js?v=0.34.0"></script>
</body>
</html>
