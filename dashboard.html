<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuyd Introduction — Day 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#080808;--blue:#2D2382;--orange:#F07800;--yellow:#FFE600;--cyan:#007BC7;--red:#E81A32;--green:#82C8B4;--pink:#FFB9D7;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:"IBM Plex Sans",sans-serif;color:var(--ink)}
body{padding:6px}
.dashboard{width:100%;height:100%;display:grid;grid-template-columns:61% 39%;gap:6px;background:var(--ink)}
.main,.side{background:var(--paper);min-width:0;min-height:0}
.main{display:flex;flex-direction:column}
.hero{display:grid;grid-template-columns:1fr auto;gap:2vw;align-items:end;padding:3.2vh 3vw 2.3vh;border-bottom:6px solid var(--ink)}
.kicker,.mono{font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.13em}
.kicker{font-size:clamp(12px,1vw,18px);font-weight:600;color:var(--red);margin-bottom:.7vh}
h1{font:400 clamp(30px,3.5vw,64px)/.95 "Archivo Black";margin:0;letter-spacing:-.035em}
.place{font-size:clamp(13px,1vw,18px);margin-top:1vh;font-weight:600}
.clock{text-align:right;font:400 clamp(34px,4.1vw,76px)/.9 "Archivo Black";letter-spacing:-.04em}
.clock small{display:block;font:500 clamp(10px,.85vw,15px)/1.2 "IBM Plex Mono";letter-spacing:.08em;margin-top:1vh}
.schedule{padding:1.2vh 2.3vw 2vh;display:flex;flex-direction:column;gap:.45vh;flex:1;min-height:0}
.row{position:relative;display:grid;grid-template-columns:8.4em 1fr minmax(9em,15em);gap:1.3vw;align-items:center;padding:.8vh 1vw;border-bottom:1px solid #ddd;min-height:0;flex:1}
.row .time{font:600 clamp(13px,1.05vw,19px)/1.1 "IBM Plex Mono";color:var(--blue)}
.row .activity{font-size:clamp(15px,1.35vw,24px);font-weight:700;line-height:1.08}
.row .note{font-size:clamp(10px,.78vw,14px);opacity:.62;margin-top:.25em;font-weight:500}
.row .loc{font:500 clamp(10px,.82vw,15px)/1.2 "IBM Plex Mono";text-align:right}
.row.now{background:var(--yellow);border:3px solid var(--ink);padding-left:1.2vw}
.row.now:before{content:"NOW";position:absolute;left:-2.3vw;top:50%;transform:translateY(-50%) rotate(-90deg);font:600 10px "IBM Plex Mono";letter-spacing:.1em}
.row.next{background:#f5f5f5}
.row.next .activity:after{content:"  NEXT";font:600 9px "IBM Plex Mono";letter-spacing:.1em;background:var(--pink);padding:.3em .55em;margin-left:.7em;vertical-align:.2em}
.side{display:grid;grid-template-rows:34% 37% 29%;gap:6px;background:var(--ink)}
.card{background:var(--paper);position:relative;overflow:hidden;padding:2.5vh 2.2vw}
.card-label{font:600 clamp(10px,.8vw,14px) "IBM Plex Mono";text-transform:uppercase;letter-spacing:.14em;margin-bottom:1.2vh}
.weather{background:var(--blue);color:white;display:grid;grid-template-columns:1fr auto;align-items:center}
.weather .card-label{position:absolute;top:2.4vh;left:2.2vw;opacity:.72}
.temp{font:400 clamp(58px,6vw,112px)/.8 "Archivo Black";letter-spacing:-.06em}
.condition{font-size:clamp(14px,1.25vw,22px);font-weight:600;margin-top:1.3vh}
.weather-meta{font:500 clamp(10px,.8vw,14px)/1.7 "IBM Plex Mono";opacity:.8}
.weather-icon{font-size:clamp(55px,6vw,110px);line-height:1}
.fact{display:flex;flex-direction:column;justify-content:center}
.fact .card-label{color:var(--orange)}
.fact-text{font:400 clamp(20px,2.2vw,40px)/1.08 "Archivo Black";letter-spacing:-.025em;max-width:24ch}
.fact-cat{font:600 clamp(9px,.72vw,12px) "IBM Plex Mono";text-transform:uppercase;letter-spacing:.12em;color:var(--orange);margin-top:1.4vh}
.mapcard{padding:0;display:grid;grid-template-columns:44% 56%}
.mapcopy{padding:2.2vh 1.6vw;background:var(--green);z-index:2}
.mapcopy .where{font:400 clamp(21px,2vw,36px)/1 "Archivo Black";margin-top:1.2vh}
.mapcopy .hint{font-size:clamp(10px,.8vw,14px);line-height:1.3;margin-top:1vh}
.map{background:url("landgoed-leudal-map.jpg") center 49%/cover no-repeat;filter:saturate(.9) contrast(1.02)}
.fact.flash{animation:swap .55s ease} @keyframes swap{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.offline{opacity:.65}
.controls{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;opacity:0;transition:.2s;z-index:10} body:hover .controls{opacity:1}
button{font:600 11px "IBM Plex Mono";border:2px solid #000;background:#fff;padding:8px 11px;cursor:pointer}
@media(max-width:900px){body{overflow:auto}.dashboard{grid-template-columns:1fr;height:auto}.side{grid-template-rows:280px 300px 300px}.main{min-height:850px}}
</style>
</head>
<body>
<div class="dashboard">
  <main class="main">
    <header class="hero">
      <div>
        <div class="kicker">Introduction week · Day 2</div>
        <h1>Wednesday 2 September</h1>
        <div class="place">Landgoed Leudal</div>
      </div>
      <div class="clock"><span id="clock">--:--</span><small id="date">LOCAL TIME</small></div>
    </header>
    <section class="schedule" id="schedule"></section>
  </main>

  <aside class="side">
    <section class="card weather">
      <div class="card-label">Weather · Landgoed Leudal</div>
      <div>
        <div class="temp" id="temp">--°</div>
        <div class="condition" id="condition">Loading weather…</div>
        <div class="weather-meta" id="weatherMeta"></div>
      </div>
      <div class="weather-icon" id="weatherIcon">◌</div>
    </section>

    <section class="card fact" id="factCard">
      <div class="card-label">Did you know?</div>
      <div class="fact-text" id="factText"></div>
      <div class="fact-cat" id="factCat"></div>
    </section>

    <section class="card mapcard">
      <div class="mapcopy">
        <div class="card-label">Where?</div>
        <div class="where" id="where">Landgoed Leudal</div>
        <div class="hint" id="whereHint">The map stays visible all day. The location here follows the current activity.</div>
      </div>
      <div class="map" aria-label="Map of Landgoed Leudal"></div>
    </section>
  </aside>
</div>
<div class="controls"><button id="factBtn">New fact</button><button id="fsBtn">Fullscreen</button></div>
<script>
const programme = [
 {start:"08:30",end:"09:30",activity:"Pilates or Forest Hike",note:"Optional — pick one",location:"Activity Area"},
 {start:"09:30",end:"10:30",activity:"Breakfast",note:"",location:"Recreation Area 1"},
 {start:"11:00",end:"12:00",activity:"Speeddate activity",note:"Depending on the weather",location:"Activity Area / Recreation Area 2"},
 {start:"13:00",end:"14:00",activity:"Lunch buffet",note:"",location:"Recreation Area 1"},
 {start:"15:00",end:"17:00",activity:"Afternoon workshops — Funfactory",note:"Bring old clothes!",location:"Activity Area / Recreation Area 1"},
 {start:"18:00",end:"20:00",activity:"BBQ",note:"",location:"Outside Recreation Area 1"},
 {start:"20:00",end:"23:59",activity:"Pub quiz, karaoke, gaming & boardgames",note:"",location:"Recreation Area 2"}
];
const facts = [
      {"cat":"Dutch Culture","text":'The Netherlands has more bikes than people — over 23 million bikes for 17.9 million residents.'},
      {"cat":"Dutch Culture","text":'The Dutch are the tallest people in the world on average.'},
      {"cat":"Dutch Culture","text":'Dutch is spoken by about 24 million people worldwide, including in Belgium, Suriname and Aruba.'},
      {"cat":"Dutch Culture","text":"King's Day on April 27 turns the whole country orange for street markets and parties."},
      {"cat":"Dutch Culture","text":'About a quarter of the Netherlands lies below sea level.'},
      {"cat":"Dutch Culture","text":'Dutch directness is cultural — saying exactly what you think is considered honest, not rude.'},
      {"cat":"Dutch Culture","text":'“Gezelligheid” is a Dutch word for cosiness, warmth and togetherness.'},
      {"cat":"Dutch Culture","text":'The Netherlands still has more than 1,000 windmills standing today.'},
      {"cat":"Dutch Culture","text":'Van Gogh, Rembrandt and Vermeer are all Dutch painters.'},
      {"cat":"Dutch Culture","text":'Stroopwafels were invented in Gouda in the late 1700s.'},
      {"cat":"Dutch Culture","text":'Amsterdam has around 165 canals.'},
      {"cat":"Dutch Culture","text":'The Netherlands was the first country to legalize same-sex marriage, in 2001.'},
      {"cat":"Dutch Culture","text":'The Dutch flag is one of the oldest tricolour flags still in use.'},
      {"cat":"Dutch Culture","text":'Planning coffee with a friend two weeks ahead is completely normal — agendas rule Dutch life.'},
      {"cat":"Maastricht & Limburg","text":'Maastricht has Roman roots going back more than 2,000 years.'},
      {"cat":"Maastricht & Limburg","text":'Maastricht sits close to both Belgium and Germany.'},
      {"cat":"Maastricht & Limburg","text":'The Maastricht Treaty was signed in 1992 and helped create the European Union as we know it.'},
      {"cat":"Maastricht & Limburg","text":'Boekhandel Dominicanen is a bookshop inside a former medieval church.'},
      {"cat":"Maastricht & Limburg","text":'The Vrijthof is one of Maastricht’s best-known squares.'},
      {"cat":"Maastricht & Limburg","text":'The Sint-Pietersberg contains an enormous network of marl caves.'},
      {"cat":"Maastricht & Limburg","text":'Limburg has its own strong regional identity and dialects.'},
      {"cat":"Maastricht & Limburg","text":'Vlaai is one of Limburg’s most famous regional treats.'},
      {"cat":"Maastricht & Limburg","text":'The Netherlands has 12 provinces. Limburg is the southernmost one.'},
      {"cat":"Dutch Culture","text":'Dutch students often travel by bicycle, even when it rains.'},
      {"cat":"Dutch Culture","text":'Orange is the Dutch national colour because of the House of Orange-Nassau.'},
      {"cat":"Dutch Culture","text":'The Dutch word ‘borrel’ means much more than just a drink: it is a social event.'},
      {"cat":"Dutch Culture","text":'Many Dutch towns have a weekly open-air market.'},
      {"cat":"Dutch Culture","text":'The Dutch coastline is protected by an enormous system of dunes, dikes and storm barriers.'},
      {"cat":"Dutch Culture","text":'The Delta Works are one of the largest flood-protection projects in the world.'},
      {"cat":"Dutch Culture","text":'The Netherlands is famously flat, but South Limburg actually has hills.'},
      {"cat":"Dutch Culture","text":'The highest point of the European Netherlands is the Vaalserberg in Limburg.'},
      {"cat":"Dutch Culture","text":'At the Vaalserberg you can stand close to the Netherlands, Belgium and Germany at once.'},
      {"cat":"Dutch Culture","text":'The Netherlands is one of the most densely populated countries in Europe.'},
      {"cat":"Dutch Culture","text":'Dutch birthday parties traditionally congratulate not only the birthday person, but often their family too.'},
      {"cat":"Dutch Culture","text":'A ‘kringverjaardag’ is the classic Dutch birthday setup where everyone sits in a circle.'},
      {"cat":"Dutch Culture","text":'French fries are often eaten with mayonnaise in the Netherlands.'},
      {"cat":"Dutch Culture","text":'A ‘kapsalon’ is both a hairdresser and, confusingly, the name of a Dutch fast-food dish.'},
      {"cat":"Dutch Culture","text":'Drop, Dutch liquorice, can be sweet, salty or extremely salty.'},
      {"cat":"Dutch Culture","text":'Hagelslag is chocolate sprinkles eaten on bread, including at breakfast.'},
      {"cat":"Dutch Culture","text":'Beschuit met muisjes is traditionally served to celebrate the birth of a baby.'},
      {"cat":"Dutch Culture","text":'Dutch pancakes are thinner than American pancakes and can be sweet or savoury.'},
      {"cat":"Dutch Culture","text":'Poffertjes are tiny fluffy pancakes usually served with butter and powdered sugar.'},
      {"cat":"Dutch Culture","text":'A typical Dutch lunch can be surprisingly simple: bread, cheese and cold cuts.'},
      {"cat":"Dutch Culture","text":'The Dutch railway network is one of the busiest in Europe.'},
      {"cat":"Dutch Culture","text":'OV-fiets lets travellers rent a bicycle at many Dutch train stations.'},
      {"cat":"Dutch Culture","text":'The Netherlands has hundreds of kilometres of dedicated bicycle paths.'},
      {"cat":"Dutch Culture","text":'Many Dutch traffic lights have separate signals specifically for cyclists.'},
      {"cat":"Dutch Culture","text":'Amsterdam is the capital, but the Dutch government and parliament are in The Hague.'},
      {"cat":"Dutch Culture","text":'The Netherlands and Holland are not exactly the same thing: Holland is only two provinces.'},
      {"cat":"Dutch Culture","text":'Schiphol Airport sits several metres below sea level.'},
      {"cat":"Dutch Culture","text":'The Dutch have been reclaiming land from water for centuries.'},
      {"cat":"Dutch Culture","text":'Flevoland is largely built on land reclaimed from the former Zuiderzee.'},
      {"cat":"Dutch Culture","text":'A polder is land enclosed by dikes where the water level is artificially controlled.'},
      {"cat":"Maastricht & Limburg","text":'Maastricht’s local name in Limburgish is Mestreech.'},
      {"cat":"Maastricht & Limburg","text":'Carnival is especially huge in Limburg, where towns temporarily take on carnival names.'},
      {"cat":"Maastricht & Limburg","text":'Maastricht is built on both sides of the river Maas.'},
      {"cat":"Maastricht & Limburg","text":'The Sint Servaasbrug in Maastricht is often described as the oldest bridge in the Netherlands.'},
      {"cat":"Maastricht & Limburg","text":'South Limburg’s landscape looks noticeably different from much of the rest of the country.'},
      {"cat":"Maastricht & Limburg","text":'Coffee is deeply embedded in Dutch work and social culture.'},
      {"cat":"Maastricht & Limburg","text":'Welcome to the Netherlands — where the weather changes faster than the programme.'}
];

function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function renderSchedule(){
 const box=document.getElementById("schedule"); box.innerHTML="";
 const now=new Date(); const n=now.getHours()*60+now.getMinutes();
 let active=-1,next=-1;
 programme.forEach((p,i)=>{if(n>=mins(p.start)&&n<mins(p.end))active=i;});
 if(active<0){next=programme.findIndex(p=>mins(p.start)>n)} else next=active+1<programme.length?active+1:-1;
 programme.forEach((p,i)=>{
  const r=document.createElement("div"); r.className="row"+(i===active?" now":i===next?" next":"");
  r.innerHTML=`<div class="time">${p.start}${p.end==="23:59"?"":"–"+p.end}</div><div><div class="activity">${p.activity}</div>${p.note?`<div class="note">${p.note}</div>`:""}</div><div class="loc">${p.location}</div>`;
  box.appendChild(r);
 });
 const focus=active>=0?programme[active]:(next>=0?programme[next]:programme[programme.length-1]);
 document.getElementById("where").textContent=focus.location;
 document.getElementById("whereHint").textContent=active>=0?"Current activity location":"Next activity location";
}
function tick(){
 const d=new Date();
 document.getElementById("clock").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
 renderSchedule();
}
let factIndex=Math.floor(Math.random()*facts.length);
function showFact(force=false){
 const f=facts[factIndex%facts.length]; const card=document.getElementById("factCard");
 card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
 document.getElementById("factText").textContent=f.text; document.getElementById("factCat").textContent=f.cat;
 factIndex=(factIndex+1)%facts.length;
}
function weatherText(code){
 if(code===0)return["Clear sky","☀"];
 if(code<=2)return["Partly cloudy","🌤"];
 if(code===3)return["Overcast","☁"];
 if(code<=48)return["Foggy","🌫"];
 if(code<=57)return["Drizzle","🌦"];
 if(code<=67)return["Rain","🌧"];
 if(code<=77)return["Snow","🌨"];
 if(code<=82)return["Rain showers","🌦"];
 if(code<=86)return["Snow showers","🌨"];
 return["Thunderstorms","⛈"];
}
async function loadWeather(){
 // Approximate coordinates for Landgoed Leudal / Haelen area.
 const url="https://api.open-meteo.com/v1/forecast?latitude=51.24&longitude=5.96&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FAmsterdam&forecast_days=1";
 try{
  const r=await fetch(url); if(!r.ok)throw new Error("weather");
  const j=await r.json(), c=j.current, d=j.daily, wt=weatherText(c.weather_code);
  document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°";
  document.getElementById("condition").textContent=wt[0];
  document.getElementById("weatherIcon").textContent=wt[1];
  document.getElementById("weatherMeta").innerHTML=`Feels like ${Math.round(c.apparent_temperature)}°<br>High ${Math.round(d.temperature_2m_max[0])}° · Low ${Math.round(d.temperature_2m_min[0])}°<br>Rain chance ${d.precipitation_probability_max[0]??0}%`;
 }catch(e){
  document.getElementById("condition").textContent="Weather unavailable";
  document.getElementById("weatherMeta").textContent="Internet connection required";
  document.querySelector(".weather").classList.add("offline");
 }
}
tick(); setInterval(tick,30000);
showFact(); setInterval(showFact,5*60*1000);
loadWeather(); setInterval(loadWeather,10*60*1000);
document.getElementById("factBtn").onclick=showFact;
document.getElementById("fsBtn").onclick=()=>document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
