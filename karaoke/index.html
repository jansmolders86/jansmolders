<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Karaoke 2026</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#fff;background:#07080a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 110%,#222630,#07080a 58%);overflow:hidden}
main{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:30px 5vw 22px}
header{display:flex;gap:16px;align-items:center;min-height:74px;position:relative}.cover{width:66px;height:66px;border-radius:10px;object-fit:cover;background:#17191e}
.meta{min-width:0}.meta h1{font-size:clamp(18px,2.1vw,29px);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta p{margin:0;color:#8d94a2}
.spotify{margin-left:auto;font-size:12px;color:#8d94a2}.brand{display:flex;align-items:center;gap:10px;margin-right:10px}.zuydmark{font-weight:950;font-size:25px;letter-spacing:-1.7px;color:#e43d46}.brandcopy{font-size:11px;line-height:1.15;color:#9aa0ab;text-transform:uppercase;letter-spacing:.11em}.brandline{position:absolute;left:0;right:0;bottom:-10px;height:2px;background:linear-gradient(90deg,#e43d46 0 72px,rgba(228,61,70,.18) 72px,transparent 42%)}.lyrics{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:18px}
.line{max-width:1200px;font-weight:850;line-height:1.1}.prev,.next{font-size:clamp(23px,3vw,48px);color:#4f5561}.current{font-size:clamp(38px,5.8vw,92px);color:#fff}.current::selection{background:#e43d46}.fill{background:#e43d46!important}
.status{font-size:clamp(28px,4.4vw,66px);font-weight:850;max-width:1100px}.sub{font-size:clamp(15px,1.5vw,22px);color:#858c99;margin-top:8px}
footer{display:flex;align-items:center;gap:12px}.bar{height:5px;background:#242730;border-radius:10px;flex:1;overflow:hidden}.fill{height:100%;width:0;background:#fff}.time{font-size:12px;color:#858c99;font-variant-numeric:tabular-nums}
#error{position:fixed;inset:auto 20px 20px 20px;background:#2a1717;border:1px solid #633;padding:14px 18px;border-radius:12px;display:none}
</style>
</head><body>
<main>
<header><div class="brand" aria-label="Zuyd Hogeschool"><div class="zuydmark">zuyd.</div><div class="brandcopy">Hogeschool<br>Student Karaoke</div></div><img id="cover" class="cover" alt=""><div class="meta"><h1 id="song">Karaoke wordt gestart…</h1><p id="artist">Spotify verbinden</p></div><div class="spotify">Spotify playback</div><div class="brandline"></div></header>
<section class="lyrics" id="lyrics"><div><div class="status">🎤 Zuyd Karaoke</div><div class="sub">De karaoke-display maakt automatisch verbinding met Spotify.</div></div></section>
<footer><span class="time" id="t1">0:00</span><div class="bar"><div class="fill" id="fill"></div></div><span class="time" id="t2">0:00</span></footer>
</main><div id="error"></div>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
